<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#170f08; }
  #scene { position:fixed; inset:0; }
  #scene canvas { display:block; }
  /* Loading veil: a lotus spinner only — no text, no buttons (broadcast frame stays clean). */
  #loading { position:fixed; inset:0; z-index:50; background:radial-gradient(circle at 50% 35%, #3a2410, #170f08 75%);
    display:flex; align-items:center; justify-content:center; transition:opacity .8s; }
  #loading .spin { font-size:44px; animation:sp 1.6s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  #loading.done { opacity:0; pointer-events:none; }
  /* v0.1.18: participation notice board (Anita's text, self-cultivation
     wording — never "temple"). Shown/hidden by the bangThongBao command;
     positioned over the stage by applySize(). */
  .plboard { position:fixed; z-index:40; display:none; background:rgba(18,9,3,.80);
    border:1px solid rgba(245,201,94,.55); border-radius:10px; color:#ffe9b8;
    padding:10px 12px; line-height:1.55; box-shadow:0 2px 14px rgba(0,0,0,.45);
    font-family:Arial, "Helvetica Neue", sans-serif; }
  .plboard .pb-title { color:#f5c95e; font-weight:700; letter-spacing:.4px; }
  .plboard .pb-sub { color:#cbb27f; font-style:italic; }
  .plboard b { color:#fff2cf; }
  /* v0.1.19: the board is draggable by its body and resizable from the
     corner grip; the text wraps on its own as the board narrows. */
  #boardMain { cursor:move; user-select:none; -webkit-user-select:none; touch-action:none; }
  #boardPill { cursor:move; user-select:none; -webkit-user-select:none; touch-action:none; }
  #boardMain .pb-grip { position:absolute; right:1px; bottom:0; width:18px; height:18px;
    cursor:nwse-resize; color:rgba(245,201,94,.85); font-size:12px; line-height:18px; text-align:center; }
  /* v0.1.25 (Anita #29): broadcast mode — Dai Phat audio engine lives in
     the room page so the phone streams picture + sound from one page.
     The bar below is the LOCAL fallback toggle: it appears ONLY in
     operator mode (?controls=1) and only in the letterbox OUTSIDE the
     9:16 stage (positioned by applySize); the broadcast frame itself
     never shows any player UI. */
  #dpBar { position:fixed; z-index:45; display:none; align-items:center; gap:8px;
    background:rgba(18,9,3,.85); border:1px solid rgba(245,201,94,.55); border-radius:8px;
    color:#ffe9b8; padding:6px 10px; font-family:Arial, "Helvetica Neue", sans-serif;
    font-size:12px; line-height:1.4; }
  #dpBar button { background:#7e1f16; color:#ffe9b8; border:1px solid #a03a28; border-radius:6px;
    padding:5px 10px; font-size:12px; cursor:pointer; font-family:inherit; }
  #dpBar button.off { background:#3a2a1a; border-color:#6b4e2a; }
</style>

<body>
<div id="scene"></div>
<div id="loading"><div class="spin">🪷</div></div>
<!-- v0.1.27 (#29 cross-device): Dai Phat voice + music bed as real
     <audio> elements + Media Session (not WebAudio-only) so playback
     survives as much as the mobile OS allows when the room is not the
     foreground app during screen-share. No controls attribute — they
     render nothing, never in the stage. -->
<audio id="dpVoice" preload="auto"></audio>
<audio id="dpBed" preload="auto" loop></audio>
<div id="dpBar"><button id="dpBarBtn" class="off">🎙 Bật đài phát</button><span id="dpBarState">Đài phát đang tắt</span></div>
<div id="boardMain" class="plboard">
  <div class="pb-title">📋 THAM GIA CÙNG PHÒNG</div>
  <div class="pb-sub">🌿 Một nơi yên tĩnh để tự tu tập</div>
  <div>⌨️ Gõ <b>"Adidaphat"</b> → vào phòng, đốt nhang</div>
  <div>🙏 Gõ <b>"lạy"</b> → được gọi ra lạy Phật</div>

</div>

<script src="xam-data.js"></script>
<!-- v0.1.27 (#29 cross-device): Supabase JS client (UMD global
     window.supabase) for the Realtime command channel. Classic script
     so it loads before the module below. -->
<script src="vendor/supabase.min.js"></script>
<script>
/* If the module below fails very early (bad cache, missing vendor file), never
   leave the broadcast on a dead veil: after 25 s offer a plain reload tap area. */
setTimeout(function () {
  var ld = document.getElementById('loading');
  if (ld && !ld.classList.contains('done')) {
    ld.innerHTML = '<div class="spin">🪷</div>';
    ld.addEventListener('click', function () { location.reload(); });
  }
}, 25000);
if ('serviceWorker' in navigator) {
  addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/": "./vendor/addons/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/utils/meshopt_decoder.mjs'; /* v0.1.26: meshopt-compressed models */

/* =====================================================================
   PHONG LIVE — a staged meditation hall for livestream.
   Controlled from outside through window.PhongLive (see bottom).
   The broadcast frame contains NO menu, buttons, instructions or
   version text. Devotee name labels and the fortune board are part
   of the scene itself.
   Room axes: +Z toward the entrance/camera, Buddha at the -Z end.
   Room size: 24 m wide (X) x 30 m deep (Z) x 12 m high (Y).
   ===================================================================== */

const ROOM = { W: 24, D: 30, H: 12 };

/* ---------- renderer / scene / camera ---------- */
const container = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x201105);
scene.fog = new THREE.Fog(0x2a1608, 34, 85);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 5.8, 17.5);

const controls = new OrbitControls(camera, renderer.domElement);
/* Orbit is a checking tool only: it stays OFF on the broadcast page and is
   enabled with ?controls=1 (control.html embeds the page that way). */
controls.enabled = new URLSearchParams(location.search).has('controls');
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.58;
controls.minDistance = 3;
controls.maxDistance = 40;
controls.target.set(0, 1.0, -4);
camera.lookAt(controls.target);

/* v0.1.18 (Anita 2026-11-15): stream frame lock + notice board.
   khungPhat locks the stage to an exact centered 9:16 — the verified
   broadcast composition — whatever shape the window is, so nobody has
   to hand-drag a window to an exact size before going live.
   bangThongBao shows/hides the participation board. Both are ordinary
   PhongLive commands (control.html, BroadcastChannel) and persist in
   localStorage per browser. */
let streamFrame = false, boardOn = false;
let boardPos = null, boardPillPos = null, boardWFrac = 0;
try {
  streamFrame = localStorage.getItem('pl-khung-phat') === '1';
  boardOn = localStorage.getItem('pl-bang') === '1';
  boardPos = JSON.parse(localStorage.getItem('pl-board-pos') || 'null');
  boardPillPos = JSON.parse(localStorage.getItem('pl-board-pill-pos') || 'null');
  boardWFrac = parseFloat(localStorage.getItem('pl-board-w') || '0') || 0;
} catch (e) {}
const boardMain = document.getElementById('boardMain');
const boardPill = document.getElementById('boardPill');
function stageRect() {
  if (!streamFrame) return { x: 0, y: 0, w: innerWidth, h: innerHeight };
  let h = innerHeight, w = Math.round(h * 9 / 16);
  if (w > innerWidth) { w = innerWidth; h = Math.round(w * 16 / 9); }
  return { x: Math.round((innerWidth - w) / 2), y: Math.round((innerHeight - h) / 2), w, h };
}
function applySize() {
  const r = stageRect();
  const cv = renderer.domElement;
  cv.style.position = 'absolute';
  cv.style.left = r.x + 'px'; cv.style.top = r.y + 'px';
  camera.aspect = r.w / r.h;
  camera.updateProjectionMatrix();
  renderer.setSize(r.w, r.h);
  const pad = Math.max(8, Math.round(r.w * 0.022));
  const fs = Math.max(11, Math.round(r.w * 0.031));
  for (const b of [boardMain, boardPill]) {
    b.style.display = boardOn ? 'block' : 'none';
    b.style.fontSize = fs + 'px';
  }
  if (boardWFrac) { boardMain.style.width = Math.round(boardWFrac * r.w) + 'px'; boardMain.style.maxWidth = 'none'; }
  else { boardMain.style.width = ''; boardMain.style.maxWidth = Math.round(r.w * 0.62) + 'px'; }
  placeBoard(boardMain, boardPos, r.x + pad, r.y + pad, r, pad);
  placeBoard(boardPill, boardPillPos, null, r.y + Math.round(r.h * 0.36), r, pad);
  if (typeof dpPlaceBar === 'function') dpPlaceBar(); /* v0.1.25: local Dai Phat toggle, letterbox only */
}
/* Position one board inside the stage: saved fraction if the operator
   dragged it, else the default spot; then clamp so it never leaves the
   stage. defX null means "default to the stage's right edge". */
function placeBoard(el, frac, defX, defY, r, pad) {
  let x = frac ? r.x + frac.x * r.w : defX;
  const y = frac ? r.y + frac.y * r.h : defY;
  if (x === null || x === undefined) x = r.x + r.w - el.offsetWidth - pad;
  el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.right = 'auto';
  if (!boardOn) return;
  const b = el.getBoundingClientRect();
  let nx = b.left, ny = b.top;
  if (b.right > r.x + r.w) nx -= (b.right - (r.x + r.w));
  if (b.bottom > r.y + r.h) ny -= (b.bottom - (r.y + r.h));
  if (nx < r.x) nx = r.x;
  if (ny < r.y) ny = r.y;
  el.style.left = nx + 'px'; el.style.top = ny + 'px';
}
addEventListener('resize', applySize);
applySize();
function setKhungPhat(on) {
  streamFrame = (on === undefined) ? !streamFrame : !!on;
  try { localStorage.setItem('pl-khung-phat', streamFrame ? '1' : '0'); } catch (e) {}
  applySize();
  if (streamFrame) cameraVungPhat();
  return { ok: true, khungPhat: streamFrame };
}
function setBangThongBao(on) {
  boardOn = (on === undefined) ? !boardOn : !!on;
  try { localStorage.setItem('pl-bang', boardOn ? '1' : '0'); } catch (e) {}
  applySize();
  return { ok: true, bangThongBao: boardOn };
}
/* v0.1.19 (Anita): drag the board by its body to anywhere in the stage;
   drag the corner grip to narrow it and the text wraps by itself.
   Layout is stored as stage fractions so it survives window resizes. */
function saveBoardLayout() {
  try {
    if (boardPos) localStorage.setItem('pl-board-pos', JSON.stringify(boardPos));
    if (boardPillPos) localStorage.setItem('pl-board-pill-pos', JSON.stringify(boardPillPos));
    if (boardWFrac) localStorage.setItem('pl-board-w', String(boardWFrac));
  } catch (e) {}
}
function makeDraggable(el, opts) {
  el.addEventListener('pointerdown', (e) => {
    if (!boardOn) return;
    const mode = (opts.resizable && e.target.classList && e.target.classList.contains('pb-grip')) ? 'resize' : 'move';
    const r = stageRect();
    const b = el.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const start = { left: b.left, top: b.top, w: b.width, h: b.height };
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
    const onMove = (ev) => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (mode === 'move') {
        const nx = Math.min(Math.max(start.left + dx, r.x), r.x + r.w - start.w);
        const ny = Math.min(Math.max(start.top + dy, r.y), r.y + r.h - start.h);
        el.style.left = nx + 'px'; el.style.top = ny + 'px';
        const frac = { x: (nx - r.x) / r.w, y: (ny - r.y) / r.h };
        if (opts.key === 'main') boardPos = frac; else boardPillPos = frac;
      } else {
        const nw = Math.min(Math.max(start.w + dx, r.w * 0.26), r.w * 0.92);
        el.style.width = nw + 'px'; el.style.maxWidth = 'none';
        boardWFrac = nw / r.w;
      }
    };
    const onUp = () => {
      el.removeEventListener('pointermove', onMove);
      el.removeEventListener('pointerup', onUp);
      el.removeEventListener('pointercancel', onUp);
      saveBoardLayout();
    };
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onUp);
  });
}
makeDraggable(boardMain, { resizable: true, key: 'main' });
makeDraggable(boardPill, { resizable: false, key: 'pill' });
function setDatLaiBang() {
  boardPos = null; boardPillPos = null; boardWFrac = 0;
  try {
    localStorage.removeItem('pl-board-pos');
    localStorage.removeItem('pl-board-pill-pos');
    localStorage.removeItem('pl-board-w');
  } catch (e) {}
  applySize();
  return { ok: true };
}

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0xffe2b0, 0x5a3a20, 0.85));
const sun = new THREE.DirectionalLight(0xffd9a0, 1.6);
sun.position.set(10, 16, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -18; sun.shadow.camera.right = 18;
sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
sun.shadow.camera.far = 60; sun.shadow.bias = -0.0004;
scene.add(sun);
const altarLight = new THREE.PointLight(0xffb45e, 60, 18, 1.8);
altarLight.position.set(0, 4.2, -11.6); scene.add(altarLight);
const frontSpot = new THREE.SpotLight(0xffd9a8, 350, 60, 0.62, 0.55, 1.4);
frontSpot.position.set(0, 10.5, 13.5);
frontSpot.target.position.set(0, 1.6, -9.2);
scene.add(frontSpot, frontSpot.target);
const fillLight = new THREE.PointLight(0xffc98a, 30, 30, 1.9);
fillLight.position.set(0, 7, 6); scene.add(fillLight);

/* ---------- small helpers ---------- */
function canvasTexture(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
const MAT = {
  woodDark:  new THREE.MeshStandardMaterial({ color: 0x4a2c14, roughness: 0.85 }),
  woodRed:   new THREE.MeshStandardMaterial({ color: 0x7e1f16, roughness: 0.62 }),
  lacquer:   new THREE.MeshStandardMaterial({ color: 0x8c241a, roughness: 0.45 }),
  gold:      new THREE.MeshStandardMaterial({ color: 0xc9a227, roughness: 0.32, metalness: 0.75 }),
  goldSoft:  new THREE.MeshStandardMaterial({ color: 0xd9b45c, roughness: 0.5, metalness: 0.4 }),
  bronze:    new THREE.MeshStandardMaterial({ color: 0x8a6a34, roughness: 0.45, metalness: 0.65 }),
  stone:     new THREE.MeshStandardMaterial({ color: 0x6b3a26, roughness: 0.95 }), /* v0.1.21: was pale 0x9a8a76 — the altar base, front steps and column plinths read as a bright white band against the warm red-gold backdrop and made the painting junction look pasted on (Anita 2026-11-15). Now a warm dark terracotta-brown that sits with the lacquer tiers. */
  cushion:   new THREE.MeshStandardMaterial({ color: 0xa02318, roughness: 0.8 }),
  /* v0.1.24: the altar tiers (base, stage, trim, pedestal stack, front
     steps) all wear this one plain deep red. History: v0.1.22 tried a
     patch of the painting's floor as a texture (rendered like glossy
     plastic — rejected), v0.1.23 tried Anita's rosewood texture on both
     the tiers and the painting's floor (rejected too). Anita's final
     call 2026-11-15: original painting floor restored, tiers plain
     deep red. */
  altarRed: new THREE.MeshStandardMaterial({ color: 0x751f14, roughness: 0.72 }),
};
function box(w, h, d, mat, x, y, z, parent) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  (parent || scene).add(m); return m;
}
function cyl(rt, rb, h, mat, x, y, z, parent, seg) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 20), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  (parent || scene).add(m); return m;
}
/* Load a GLB and normalise it the way the reference hall does it: measure the
   bounding box, centre X/Z on the wrap origin, rest the base on y=0, scale so
   the model is exactly targetH metres tall. If loading fails, drop a plain
   stand-in block of the same height so the show can still run. */
function loadFitted(url, targetH, onReady) {
  const wrap = new THREE.Group();
  /* v0.1.26: models are meshopt-compressed (EXT_meshopt_compression) — the
     shared loader has the decoder wired; without it GLTFLoader throws. */
  const loader = new GLTFLoader();
  loader.setMeshoptDecoder(MeshoptDecoder);
  loader.load(url, (gltf) => {
    const m = gltf.scene;
    m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    const bb = new THREE.Box3().setFromObject(m);
    const size = bb.getSize(new THREE.Vector3());
    const ctr = bb.getCenter(new THREE.Vector3());
    m.position.set(-ctr.x, -bb.min.y, -ctr.z);
    const inner = new THREE.Group(); inner.add(m);
    inner.scale.setScalar(targetH / size.y);
    wrap.add(inner);
    if (onReady) onReady(wrap, m);
  }, undefined, () => {
    const ph = box(targetH * 0.6, targetH, targetH * 0.6, MAT.goldSoft, 0, targetH / 2, 0, wrap);
    ph.castShadow = true;
    if (onReady) onReady(wrap, null);
  });
  return wrap;
}
/* Tween engine: every timed motion in the room runs through here. */
const tweens = [];
function tween(dur, update, done) {
  return new Promise((resolve) => {
    tweens.push({ t: 0, dur: Math.max(dur, 0.01), update, done: () => { if (done) done(); resolve(); } });
  });
}
const easeIO = (k) => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
function stepTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.t += dt;
    const k = Math.min(tw.t / tw.dur, 1);
    tw.update(easeIO(k), k);
    if (k >= 1) { tweens.splice(i, 1); tw.done(); }
  }
}
function lerp(a, b, k) { return a + (b - a) * k; }

/* ---------- floor, carpet, walls ---------- */
/* Wood floor: real-size planks 0.15 m wide x 1.2 m long (150 x 1200 mm),
   grain running lengthwise toward the altar (canvas vertical = world Z,
   door -> altar). One texture tile covers 6 x 6 m (repeat 4 x 5 over the
   24 x 30 m hall), so a tile holds 40 planks across and 5 plank-lengths. */
const floorTex = canvasTexture(512, 512, (g, W, H) => {
  const TILE_M = 6, PLANK_W = 0.15, PLANK_L = 1.2;
  const px = W / TILE_M;                    /* canvas px per metre */
  const pw = PLANK_W * px, pl = PLANK_L * px;
  const tones = ['#754a22', '#68401c', '#7d5026'];
  g.fillStyle = '#6e4520'; g.fillRect(0, 0, W, H);
  const cols = Math.round(TILE_M / PLANK_W); /* 40 planks per tile */
  for (let c = 0; c < cols; c++) {
    const x0 = c * pw;
    g.fillStyle = tones[(c * 7 + 1) % 3];
    g.fillRect(x0, 0, pw, H);
    /* slight per-plank shade variation */
    g.fillStyle = 'rgba(0,0,0,' + (Math.random() * 0.08).toFixed(3) + ')';
    g.fillRect(x0, 0, pw, H);
    /* grain: 2 wavy lines running the length of the plank */
    g.strokeStyle = 'rgba(60,32,8,.35)'; g.lineWidth = 1;
    for (let i = 0; i < 2; i++) {
      const gx = x0 + pw * (0.3 + i * 0.4);
      g.beginPath(); g.moveTo(gx, 0);
      g.bezierCurveTo(gx + 2, H * .3, gx - 2, H * .7, gx, H); g.stroke();
    }
    /* butt joints, staggered per column so joints never line up */
    const off = (c * 61) % pl;
    g.fillStyle = 'rgba(30,15,4,.6)';
    for (let y = off; y < H; y += pl) g.fillRect(x0, y, pw, 2);
    /* long seam between planks */
    g.fillStyle = 'rgba(40,20,5,.55)';
    g.fillRect(x0, 0, 1.5, H);
  }
});
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(4, 5);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.W, ROOM.D),
  new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.75 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const carpetTex = canvasTexture(512, 1024, (g, W, H) => {
  /* v0.1.11: ONE uniform red, gold borders on the two LONG sides only.
     The old nested fills (#8e1f14 outer / #9c2618 inner) + strokeRect borders
     on all four edges showed as a lighter "sliced band" across the carpet
     once the centre flowers were gone (Anita spotted it, Cừu diagnosed it). */
  g.fillStyle = '#9c2618'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#e3b34e';
  g.lineWidth = 10;
  g.beginPath(); g.moveTo(20, 0); g.lineTo(20, H); g.stroke();
  g.beginPath(); g.moveTo(W - 20, 0); g.lineTo(W - 20, H); g.stroke();

function faceToward(actor, dx, dz, dur) {
  const from = actor.group.rotation.y;
  let to = Math.atan2(dx, dz);
  while (to - from > Math.PI) to -= Math.PI * 2;
  while (from - to > Math.PI) to += Math.PI * 2;
  return tween(dur || 0.35, (e) => { actor.group.rotation.y = lerp(from, to, e); });
}
/* Walk a list of floor waypoints at a steady pace, with a gentle bob. */
async function walkPath(actor, points, speed) {
  for (const p of points) {
    const from = actor.group.position.clone();
    const to = new THREE.Vector3(p[0], 0, p[1]);
    const dist = from.distanceTo(to);
    if (dist < 0.02) continue;
    await faceToward(actor, to.x - from.x, to.z - from.z, 0.3);
    await tween(dist / (speed || 2.1), (e, raw) => {
      actor.group.position.lerpVectors(from, to, e);
      actor.body.position.y = Math.abs(Math.sin(raw * Math.PI * Math.max(2, dist * 2.2))) * 0.045;
      actor.body.rotation.z = Math.sin(raw * Math.PI * Math.max(2, dist * 2.2)) * 0.03;
    });
    actor.body.position.y = 0; actor.body.rotation.z = 0;
  }
}

   never yielded. */
function backMostFakeSeat() {
  let best = null;
  for (const s of seats) {
    if (!s.actor || !s.actor.isFake || s.actor.busy) continue;
    if (nguoiDangLay === s.actor.name) continue;
    if (!best || s.z > best.z || (s.z === best.z && seats.indexOf(s) < seats.indexOf(best))) best = s;

/* Spare fake names for re-seeding a seat that never held a fake (a real

const SPARE_FAKE_NAMES = ['Diệu Tâm', 'Thiện Đức', 'Phúc An', 'Tuệ An', 'Quang Tâm', 'An Hòa', 'Thiện Minh', 'Diệu An', 'Phúc Tâm', 'Tuệ Đức', 'Quang An', 'Thiện An'];

function nextSpareFakeName() {
  for (let k = 0; k < SPARE_FAKE_NAMES.length; k++) {
    const n = SPARE_FAKE_NAMES[spareFakeIdx % SPARE_FAKE_NAMES.length];
    spareFakeIdx++;

/* v0.1.16: seat a fake back into a seat a real viewer just left, so the
   room always looks full. Fire-and-forget: the caller has already returned
   by the time the fake walks in (the viewer has cleared the aisle first). */
async function reseedFake(seat) {
  if (seat.actor) return; /* someone sat down meanwhile */
  const name = seat.yieldedName && !actors.has(seat.yieldedName) ? seat.yieldedName : nextSpareFakeName();
  if (!name) return;
  const actor = makeActor(name, seat, true);
  seat.actor = actor; actor.busy = true; actors.set(name, actor);
  await walkInActor(actor, seat);
  actor.busy = false;
}
async function doAddPhatTu(name) {

  if (actors.has(name)) return { ok: false, loi: 'da co trong phong', ghe: actors.get(name).seat.code };
  /* v0.1.16: a real viewer FIRST yields a fake — the back-most fake stands
     up and walks out, and the viewer walks in and sits in that exact seat,
     so real and fake stay interleaved and the room always looks full.
     Only when no fake is left to yield does the viewer take the lowest
     free seat. */
  let seat = backMostFakeSeat();
  let yieldedName = null;
  if (seat) {
    yieldedName = seat.actor.name;

  seat.actor = actor; actor.busy = true; actors.set(name, actor);

/* raLay: stand, walk the central axis to the bow point, bow 3 times
   (kneel held steady; only the upper body bows — no height squash
   between beats), stand again and WAIT at the bow point. */
async function doRaLay(name) {
  const actor = actors.get(String(name || '').trim());
  if (!actor) return { ok: false, loi: 'khong tim thay' };
  if (nguoiDangLay) return { ok: false, loi: 'co nguoi dang lay' };
  if (actor.busy || !actor.seated) return { ok: false, loi: 'dang ban' };
  nguoiDangLay = actor.name;
  actor.busy = true; actor.out = 'dang lay';
  const seat = actor.seat;
  actor.group.position.y = 0;
  await standUp(actor);
  await walkPath(actor, [seatEntryPoints(seat), [0, seat.z + 1.15], [0, BOW_POINT.z + 1.05], [BOW_POINT.x, BOW_POINT.z]], 2.0);
  await faceToward(actor, 0, -1, 0.4);
  await kneel(actor, true); /* into the kneel and HOLD it through all 3 bows */
  for (let i = 0; i < 3; i++) {
    await tween(0.75, (e) => { actor.body.rotation.x = 0.55 * e; });
    await tween(0.95, (e) => { actor.body.rotation.x = 0.55 * (1 - e); });
    if (i < 2) await tween(0.35, () => {});
  }
  actor.body.rotation.x = 0;
  await kneel(actor, false); /* rise back to standing, still at the bow point */
  actor.out = 'dang cho';
  actor.busy = false;
  return { ok: true };
}

/* xinXam v0.1.1: ONLY the devotee currently waiting at the bow point may

   returns to their seat by the central axis on their own. */
async function doXinXam(name) {

  if (nguoiDangLay !== actor.name || actor.out !== 'dang cho') return { ok: false, loi: 'chua ra lay' };
  if (!window.XAM_DATA || !window.XAM_DATA.length) return { ok: false, loi: 'chua co du lieu xam' };
  actor.busy = true; actor.out = 'dang xin xam';

  await tween(4, (e, raw) => {
    xamAnchor.rotation.z = Math.sin(raw * Math.PI * 10) * 0.10 * Math.sin(Math.min(raw * 3, 1) * Math.PI * 0.5);
    xamAnchor.rotation.x = Math.cos(raw * Math.PI * 8) * 0.05;

  drawBoard(que);
  lastQue = { soQue: que[0], tenQue: que[1], nguoi: actor.name };
  await tween(3.2, () => {}); /* a quiet beat while the board is read */
  drawStick.visible = false; drawStick.rotation.z = 0;
  /* stand, return along the central axis, sit down — turn over */
  await kneel(actor, false);
  await returnToSeat(actor);
  nguoiDangLay = null; actor.out = null; actor.busy = false;
  return { soQue: que[0], tenQue: que[1] };
}

    const d = ev.data || {};
    if (!d.cmd) return;
    runCommand(d.cmd, d.args).then((result) => { try { bc.postMessage({ id: d.id, result }); } catch (e) {} });
  };
} catch (e) {}
addEventListener('message', (ev) => {
  const d = ev.data || {};
  if (!d.cmd || !window.PhongLive[d.cmd]) return;
  runCommand(d.cmd, d.args).then((result) => {
    if (ev.source) { try { ev.source.postMessage({ id: d.id, result }, '*'); } catch (e) {} }
  });
});

/* ---------- v0.1.27: Supabase Realtime cross-device channel ----------
   Cừu, #29 cmt 6900225350 (2026-11-16 02:47): the #29 brief required
   Supabase commands so control.html on Anita's laptop drives the room
   page on her phone during a phone screen-share live. Same Supabase
   project as Phòng Thiền (URL + public anon key, already in the
   temple's client-side code in plain text) — NEVER a service_role key.
   Channel 'phong-live:room' (temple pattern: 'pt3d:temple'), events:
     'cmd'        control -> room: { from, cmd, args, id }; the room
                  applies it via runCommand and answers 'cmd-result'.
     'cmd-result' room -> control: { from, to, id, result }.
     'state'      room -> control: { from, state } (pushed on every
                  dpPushState, so a remote control sees now-playing).
     'hello'      control -> room: { from }; the room answers 'state'.
   Every message carries a per-page clientId; the room ignores its own
   broadcasts (Supabase broadcast { self: true } echoes to the sender).
   Presence tracks { role: 'room' } so a control can see a room online.
   BroadcastChannel 'phong-live-v0.1' STAYS as the same-device fallback:
   if Supabase fails to connect, room + control still work over BC and
   state.supabase reads 'off' / 'error' (see dpState). Reconnect logic
   mirrors the temple: watchdog + visibilitychange + online. */
let plSb = null, plSbReconnectAt = 0;
function plSbConnect() {
  if (!plSb) return;
  try { if (plSbChannel) plSbChannel.unsubscribe(); } catch (e) {}
  plSbStatus = 'connecting';
  plSbChannel = plSb.channel('phong-live:room', { config: { presence: { key: PL_CLIENT_ID }, broadcast: { self: true } } });
  plSbChannel.on('presence', { event: 'sync' }, () => { plSbSendState(dpState()); });
  plSbChannel.on('broadcast', { event: 'cmd' }, ({ payload }) => {
    if (!payload || payload.from === PL_CLIENT_ID || !payload.cmd) return;
    runCommand(payload.cmd, payload.args).then((result) => {
      try { plSbChannel.send({ type: 'broadcast', event: 'cmd-result', payload: { from: PL_CLIENT_ID, to: payload.from, id: payload.id, result } }); } catch (e) {}
    });
  });
  plSbChannel.on('broadcast', { event: 'hello' }, ({ payload }) => {
    if (!payload || payload.from === PL_CLIENT_ID) return;
    plSbSendState(dpState());
  });
  plSbChannel.subscribe((status) => {
    if (status === 'SUBSCRIBED') {
      plSbStatus = 'connected';
      try { plSbChannel.track({ role: 'room', id: PL_CLIENT_ID }); } catch (e) {}
      plSbSendState(dpState());
    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
      plSbStatus = 'error'; plSbScheduleReconnect();
    }
  });
}
function plSbScheduleReconnect() {
  const now = Date.now();
  if (now < plSbReconnectAt) return;
  plSbReconnectAt = now + 8000;
  setTimeout(() => { try { plSb.realtime.disconnect(); } catch (e) {} plSbConnect(); }, 1200);
}
setInterval(() => {
  if (plSb && plSbChannel && plSbChannel.state !== 'joined' && plSbChannel.state !== 'joining') {
    plSbStatus = 'error'; plSbScheduleReconnect();
  }
}, 7000);
try {
  if (window.supabase) {
    plSb = window.supabase.createClient(PL_SB_URL, PL_SB_KEY);
    plSbConnect();
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        if (plSbChannel && plSbChannel.state === 'joined') plSbSendState(dpState());
        else plSbScheduleReconnect();
      }
    });
    addEventListener('online', () => plSbScheduleReconnect());
  }
} catch (e) { plSbStatus = 'off'; }

/* ---------- seed congregation: twenty-four fake devotees already seated ----------
   v0.1.16 (Trang 2026-11-15): names in Vietnamese WITH diacritics, and 12
   more fakes at the yellow-marked cushions (rows 3-6, staggered) — front
   two rows G01-G06 + G22-G27, plus G07, G08, G11, G12, G14, G18 (left)
   and G28, G30, G32, G33, G35, G39 (right). All seeded actors are fake
   (isFake) so a real viewer can yield them, back row first.
   v0.1.17 (Trang 2026-11-15 16:06): 7 of the new fakes re-seated to the
   MOST VISIBLE seats — inner column (|x| 3.0, hugging the red carpet),
   foreground rows 4-6 — because v0.1.16 showed only 17/24 in the 9:16
   frame (outer columns + back rows fall outside it). Moved: G12->G10,
   G14->G13, G18->G16, G30->G29, G33->G31, G35->G34, G39->G37. New fakes
   now at G07, G08, G10, G11, G13, G16 (left) and G28, G29, G31, G32,
   G34, G37 (right) — all 24 in frame by projection. */
const SEED_FAKE = [
  [0, 'Minh Ân'], [1, 'Thanh Tâm'], [2, 'Diệu Âm'], [3, 'Diệu Hương'], [4, 'Tịnh Tâm'], [5, 'Hạnh Nguyên'],
  [6, 'Diệu Pháp'], [7, 'Thiện Tâm'], [10, 'Phúc Đức'], [9, 'Tuệ Minh'], [12, 'An Nhiên'], [15, 'Diệu Liên'],
  [21, 'Phúc Lâm'], [22, 'Tuệ Nhi'], [23, 'Quang Minh'], [24, 'An Lạc'], [25, 'Thiện Duyên'], [26, 'Phước Huệ'],
  [27, 'Thiện Phước'], [28, 'Quang Đức'], [31, 'Tịnh An'], [30, 'Diệu Ngọc'], [33, 'Phúc An'], [36, 'Thiện Hạnh'],
];
SEED_FAKE.forEach(([si, name]) => {
  const seat = seats[si];
  const actor = makeActor(name, seat, true);
  seat.actor = actor; actors.set(name, actor);
  actor.group.position.set(seat.x, 0.16, seat.z);
  actor.group.rotation.y = Math.PI;
  actor.body.scale.y = 0.68; actor.tag.position.y = 1.28; actor.seated = true;
});

/* ---------- main loop: breathing, sway, glow, lantern flicker ---------- */
const clock = new THREE.Clock();
let elapsed = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  elapsed += dt;
  stepTweens(dt);
  breathFactor = lerp(breathFactor, breathTarget, dt * 1.5);
  for (const actor of actors.values()) {
    if (actor.busy) continue;
    if (actor.seated) {
      const b = Math.sin(elapsed * 1.15 * breathFactor + actor.phase);
      actor.body.scale.y = 0.68 * (1 + b * 0.018);
      actor.body.rotation.z = Math.sin(elapsed * 0.5 * breathFactor + actor.phase) * 0.008;
    } else if (actor.out === 'dang cho') {
      /* waiting at the bow point: a barely-there standing sway */
      actor.body.rotation.z = Math.sin(elapsed * 0.6 + actor.phase) * 0.006;
    }
  }
  for (const s of seats) {
    const target = deepMeditation && s.actor ? 0.5 : 0;
    s.ring.material.opacity = lerp(s.ring.material.opacity, target, dt * 2);
  }
  lanternFlames.forEach((l, i) => { l.intensity = 13 + Math.sin(elapsed * 7 + i * 2.4) * 2.2; });
  lanternGlows.forEach((gl, i) => { gl.material.opacity = 0.5 + Math.sin(elapsed * 2.1 + i * 1.7) * 0.13; });
  /* v0.1.16: burner smoke, continuous (Phong Thien formula: rise, sway,
     grow, fade in-out over each sprite's life). */
  burnerSmokes.forEach((sp, i) => {
    sp.userData.ph += dt * 0.055;
    if (sp.userData.ph > 1) sp.userData.ph -= 1;
    const ph = sp.userData.ph;
    sp.position.set(Math.sin(ph * 9 + i * 2.4) * 0.22 * ph, 0.75 + ph * 3.1, Math.cos(ph * 7 + i) * 0.18 * ph);
    const sc = 0.5 + ph * 1.9;
    sp.scale.set(sc, sc, 1);
    sp.material.opacity = Math.sin(ph * Math.PI) * 0.6; /* v0.1.16: 0.6 not 0.45 — the Phong Thien yard value reads too faint against Phong Live's bright painting; the hall burner there uses 0.72 */
  });
  burnerEmberMat.emissiveIntensity = 1.9 + Math.sin(elapsed * 7.3) * 0.45;
  {
    const bf = 0.82 + Math.sin(elapsed * 11 + 3.7 * 7) * 0.12 + Math.sin(elapsed * 23 + 3.7 * 3) * 0.07;
    burnerLight.intensity = 3.4 * bf;
    burnerGlow.material.opacity = 0.88 * bf;
    burnerFlame.scale.setScalar(0.25 * (0.9 + Math.sin(elapsed * 9) * 0.1));
  }
  altarLight.intensity = 58 + Math.sin(elapsed * 3.1) * 5;
  controls.update();
  renderer.render(scene, camera);
}
animate();

/* Lift the loading veil once the monk prototype has landed (or after a
   grace period — a placeholder body keeps the room usable regardless). */
let veilLifted = false;
function liftVeil() {
  if (veilLifted) return; veilLifted = true;
  document.getElementById('loading').classList.add('done');
  readyCallbacks.splice(0).forEach((res) => res(true));
}
monkWaiters.push(liftVeil);
setTimeout(liftVeil, 12000);
</script>
